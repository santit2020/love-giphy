services:
  - type: web
    name: love-giphy-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python loveboost.py
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GIPHY_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
